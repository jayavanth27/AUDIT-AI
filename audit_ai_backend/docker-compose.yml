version: "3.9"
services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: audit_ai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  backend:
    build: .
    depends_on:
      - db
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@db/audit_ai
      JWT_SECRET_KEY: supersecret
      AWS_REGION: us-east-1
      AWS_S3_BUCKET: mybucket
      BEDROCK_MODEL_ID: my-model
    ports:
      - "8000:8000"
    volumes:
      - .:/app

volumes:
  postgres_data:
